name: Issue Triage & Welcome

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label and welcome
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').toLowerCase();
            const labelsToAdd = [];

            if (title.includes('[bug]')) {
              labelsToAdd.push('bug');
            } else if (title.includes('[feature]')) {
              labelsToAdd.push('enhancement');
            } else if (title.includes('[i18n]') || title.includes('translation')) {
              labelsToAdd.push('translation', 'i18n');
            } else {
              labelsToAdd.push('triage');
            }

            if (labelsToAdd.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: labelsToAdd
                });
              } catch (e) {
                console.log('Label add error:', e);
              }
            }

            const author = issue.user ? issue.user.login : 'friend';
            const welcomeMessage = [
              '👋 Hi @' + author + ', thank you for opening this issue!',
              '',
              '- 📖 **Documentation & User Guide:** [https://txavl.github.io/T-Drop/](https://txavl.github.io/T-Drop/)',
              '- 📜 **Latest Changelog:** [https://txavl.github.io/T-Drop/changelog](https://txavl.github.io/T-Drop/changelog)',
              '',
              'Our team will review your submission shortly. If you have any additional logs, screenshots, or reproduction steps, feel free to leave them below.'
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: welcomeMessage
              });
            } catch (e) {
              console.log('Comment create error:', e);
            }
